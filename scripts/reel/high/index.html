<!doctype html><html><head><meta charset="utf-8"><title>HIGH reel</title><style>
@font-face{font-family:Roc;font-weight:900;src:url(fonts/Roc-Black.otf)}
@font-face{font-family:Roc;font-weight:800;src:url(fonts/Roc-Heavy.otf)}
@font-face{font-family:Roc;font-weight:700;src:url(fonts/Roc-ExtraBold.otf)}
@font-face{font-family:Manrope;font-weight:600;src:url(fonts/Manrope-SemiBold.ttf)}
@font-face{font-family:Manrope;font-weight:800;src:url(fonts/Manrope-ExtraBold.ttf)}
html,body{margin:0;background:#0A0A0E;overflow:hidden}
#stage{position:relative;width:1920px;height:1200px;overflow:hidden;background:#0A0A0E}
img{image-rendering:auto}
</style></head><body><div id="stage"></div>
<script type="module">
import * as L from "../lib.js";
import { ASSETS, SEQS, shots, local, build } from "./scenes.js";
window.ready = (async () => {
  await Promise.all(["900 100px Roc", "800 100px Roc", "700 100px Roc", "600 30px Manrope", "800 30px Manrope"].map((f) => document.fonts.load(f)));
  await L.preload(ASSETS);
  for (const [n, c] of Object.entries(SEQS)) L.seqs[n] = await L.preloadSeq(n, c);
  build(document.getElementById("stage"));
  window.FPS = L.FPS; window.FRAMES = L.FPS * L.DUR;
  window.renderFrame = (i) => {
    const gt = (i / L.FPS) % L.DUR;
    for (const s of shots) {
      const lt = local(s, gt);
      if (lt === null) { s.root.style.display = "none"; continue; }
      s.root.style.display = "";
      s.update(lt, gt);
    }
    return gt;
  };
  return { shots: shots.length, fonts: document.fonts.check("900 100px Roc") };
})();
</script></body></html>
