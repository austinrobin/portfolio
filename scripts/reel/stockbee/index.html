<!doctype html><html><head><meta charset="utf-8"><title>StockBee reel</title><style>
@font-face{font-family:Haas;font-weight:400;src:url(fonts/NeueHaasDisplayRoman.ttf)}
@font-face{font-family:Haas;font-weight:500;src:url(fonts/NeueHaasDisplayMediu.ttf)}
@font-face{font-family:Haas;font-weight:700;src:url(fonts/NeueHaasDisplayBold.ttf)}
@font-face{font-family:Mono;font-weight:400;src:url(fonts/ProtoMono-Regular.ttf)}
@font-face{font-family:Mono;font-weight:500;src:url(fonts/ProtoMono-Medium.ttf)}
html,body{margin:0;background:#0A0B0A;overflow:hidden}
#stage{position:relative;width:1920px;height:1200px;overflow:hidden;background:#0A0B0A}
</style><script>window.REEL_FPS = 30; window.REEL_DUR = 12;</script></head><body><div id="stage"></div>
<script type="module">
import * as L from "../lib.js";
import { ASSETS, SEQS, shots, local, build } from "./scenes.js";
window.ready = (async () => {
  await Promise.all(["400 40px Haas", "500 40px Haas", "700 40px Haas", "400 40px Mono", "500 40px Mono"].map((f) => document.fonts.load(f)));
  await L.preload(ASSETS);
  for (const [n, c] of Object.entries(SEQS)) L.seqs[n] = await L.preloadSeq(n, c);
  build(document.getElementById("stage"));
  window.FPS = L.FPS; window.FRAMES = L.FPS * L.DUR;
  window.renderFrame = (i) => {
    const gt = (i / L.FPS) % L.DUR;
    for (const s of shots) {
      const lt = local(s, gt);
      if (lt === null) { s.root.style.display = "none"; continue; }
      s.root.style.display = "";
      s.update(lt, gt);
    }
    return gt;
  };
  return { shots: shots.length, fps: L.FPS, dur: L.DUR };
})();
</script></body></html>
